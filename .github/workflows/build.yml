name: Build ShadowRealm 3D

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-linux:
    name: Linux (Ubuntu 24.04)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libglfw3-dev libgl1-mesa-dev libx11-dev pkg-config python3-jinja2

      - name: Fetch GLM (1.0.1) & Dear ImGui (v1.91.1)
        run: |
          git clone --depth 1 --branch 1.0.1 https://github.com/g-truc/glm.git glm
          git clone --depth 1 --branch v1.91.1 https://github.com/ocornut/imgui.git imgui

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 4

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadowrealm-linux
          path: build/shadowrealm
          retention-days: 30

  build-macos:
    name: macOS (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          brew install cmake glfw
          pip3 install jinja2 --break-system-packages

      - name: Fetch GLM (1.0.1) & Dear ImGui (v1.91.1)
        run: |
          git clone --depth 1 --branch 1.0.1 https://github.com/g-truc/glm.git glm
          git clone --depth 1 --branch v1.91.1 https://github.com/ocornut/imgui.git imgui

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPython3_EXECUTABLE="$(which python3)"

      - name: Build
        run: cmake --build build --parallel 4

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadowrealm-macos
          path: build/shadowrealm
          retention-days: 30

  build-windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jinja2
        run: python -m pip install jinja2

      - name: Fetch GLFW (3.4), GLM (1.0.1) & Dear ImGui (v1.91.1)
        shell: bash
        run: |
          git clone --depth 1 --branch 3.4 https://github.com/glfw/glfw.git glfw_src
          cmake -S glfw_src -B glfw_build -DGLFW_BUILD_EXAMPLES=OFF -DGLFW_BUILD_TESTS=OFF -DGLFW_BUILD_DOCS=OFF
          cmake --build glfw_build --config Release
          cmake --install glfw_build --prefix C:/glfw
          rm -rf glfw_src glfw_build
          git clone --depth 1 --branch 1.0.1 https://github.com/g-truc/glm.git glm
          git clone --depth 1 --branch v1.91.1 https://github.com/ocornut/imgui.git imgui

      - name: Configure
        shell: bash
        run: |
          PY_EXE="$(python -c 'import sys; print(sys.executable.replace("\\", "/"))')"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -Dglfw3_DIR=C:/glfw/lib/cmake/glfw3 -DPython3_EXECUTABLE="$PY_EXE"

      - name: Build
        run: cmake --build build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadowrealm-windows
          path: build/Release/shadowrealm.exe
          retention-days: 30