repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
  - repo: local
    hooks:
      - id: ts-typecheck
        name: TypeScript strict type-check
        entry: npm run lint
        language: system
        pass_filenames: false
      - id: causality-cpp17-check
        name: C++17 Causality.h strict check
        entry: bash -c 'printf "#include \"Causality.h\"\n" | g++ -std=c++17 -Wall -Wextra -Werror -x c++ -fsyntax-only -I. -'
        language: system
        pass_filenames: false
